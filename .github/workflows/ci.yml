name: CI

on:
    pull_request:
        branches:
            - main

jobs:
    lint:
        name: Linting
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                ref: ${{ github.head_ref }}
            
            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: 24
        
            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                path: node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json' )}}

            - name: Install dependencies
              run: npm install

            - name: Run eslint
              run: npm run lint
    
    typecheck:
        name: Typecheck
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6
              with:
                ref: ${{ github.head_ref }}

            - name: Setup Node
              uses: actions/setup-node@v6
              with:
                node-version: 24

            - name: Cache node_modules
              uses: actions/cache@v5
              with:
                path: node_modules
                key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json' )}}

            - name: Install dependencies
              run: npm install

            - name: Run typecheck
              run: npm run typecheck

    tests:
      name: Tests
      runs-on: ubuntu-latest
      steps:
          - name: Checkout
            uses: actions/checkout@v6
            with:
              ref: ${{ github.head_ref }}

          - name: Setup Node
            uses: actions/setup-node@v6
            with:
              node-version: 24

          - name: Cache node_modules
            uses: actions/cache@v5
            with:
              path: node_modules
              key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json' )}}

          - name: Install dependencies
            run: npm install

          - name: Run tests
            run: npm run test
